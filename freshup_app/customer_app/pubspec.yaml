name: grocery_customer_app
description: Customer app for grocery delivery (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.1
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  pdf: ^3.10.8
  printing: ^5.14.3
  url_launcher: ^6.3.3
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.3.2
  image_picker: ^1.2.4
  facebook_app_events: ^0.32.0
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/categories/
    - assets/images/products/
